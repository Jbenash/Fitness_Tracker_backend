spring.application.name=activity-service
server.port=8082

# Connection with MongoDB (Boot 4 uses spring.mongodb.*)
spring.mongodb.uri=${MONGODB_URI}

# RabbitMQ connection
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
rabbitmq.exchange.name=activity.exchange
rabbitmq.routing.key=activity.routing.key
rabbitmq.queue.name=activity.queue



#connection with the eureka service
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Eureka instance networking (avoid .mshome.net DNS resolution failures)
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
