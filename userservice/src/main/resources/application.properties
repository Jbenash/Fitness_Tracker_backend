server.port=8081

# PostgreSQL DataSource configuration
spring.datasource.url=jdbc:postgresql://ep-gentle-paper-am7ngaee-pooler.c-5.us-east-1.aws.neon.tech/neondb
spring.datasource.username=neondb_owner
